# A generic, single database configuration for NEEV.

[alembic]
# path to migration scripts (authoritative location inside backend)
script_location = %(here)s/migrations

# template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# version location specification
version_locations = %(here)s/migrations/versions

# default database URL for Alembic migrations (PostgreSQL only)
sqlalchemy.url = postgresql://postgres:2006@localhost:5432/neev_dev

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
